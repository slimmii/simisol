<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Lama Run</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1d1630; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none; }
    canvas { display: block; max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; width: 100vw; height: auto; }
    @media (min-aspect-ratio: 16/9) { canvas { width: auto; height: 100vh; } }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540"></canvas>
  <script src="runner.js"></script>
</body>
</html>
