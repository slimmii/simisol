# Publiceert de map app/ op GitHub Pages bij elke push naar main.
name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # songs.js opnieuw opbouwen uit app/data, zodat aanpassingen aan de liedjes altijd meekomen
      - name: Liedjes bundelen
        run: python3 tools/build_songs.py

      - name: Controle op syntaxfouten
        run: for f in app/js/*.js; do node --check "$f"; done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - id: deployment
        uses: actions/deploy-pages@v4
